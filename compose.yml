services:
  db:
    image: postgres:16-alpine
    container_name: dhaka-tesla-db
    environment:
      POSTGRES_USER: tesla
      POSTGRES_PASSWORD: tesla_password
      POSTGRES_DB: dhaka_tesla
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesla -d dhaka_tesla"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: dhaka-tesla-backend
    environment:
      DATABASE_URL: postgresql://tesla:tesla_password@db:5432/dhaka_tesla
      JWT_SECRET: change_me_for_local_docker
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    container_name: dhaka-tesla-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
